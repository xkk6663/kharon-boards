# DAP-Link（CMSIS-DAP）→ STM32F1 的 OpenOCD 配置（Blue Pill 板级）
#
# 为什么在板级：
#   Zephyr 通用 openocd runner 默认 interface/stlink.cfg；本板用 CMSIS-DAP，
#   接口层必须换。目标层用 OpenOCD 自带 target/stm32f1x.cfg（F1 系列）。
#
# 用法：west flash -d <构建目录> --runner openocd --config <本文件>
#       （kharon 面板/CLI 由芯片包 openocd_config 自动指向本文件）

source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f1x.cfg]

# 只接 SWDIO/SWCLK/GND/3V3（没接 nRST）时用 none：
# 复位走 CM3 的 SYSRESETREQ，不依赖复位线。
reset_config none
